<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password – LeasePilot</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@0.469.0"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-gradient-to-br from-slate-50 to-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <a href="login.html">
        <img src="https://ik.imagekit.io/primo/Primo%20Motif/leasepilot-logo.svg" alt="LeasePilot" class="h-10 mx-auto">
      </a>
    </div>

    <!-- Request form -->
    <div id="formCard" class="bg-white rounded-3xl shadow-xl border border-slate-200 p-8">
      <div class="mb-6">
        <h1 class="text-2xl font-semibold text-slate-900 mb-2">Forgot your password?</h1>
        <p class="text-sm text-slate-500">Enter your email and we'll send you a reset link.</p>
      </div>

      <form id="forgotForm" class="space-y-5">
        <div>
          <label for="email" class="block text-sm font-medium text-slate-700 mb-2">Email address</label>
          <div class="relative">
            <i data-lucide="mail" class="absolute left-3 top-1/2 -translate-y-1/2 h-5 w-5 text-slate-400"></i>
            <input type="email" id="email" name="email" required
              class="w-full pl-10 pr-4 py-3 rounded-xl border border-slate-200 bg-slate-50 focus:bg-white focus:border-slate-400 focus:ring-2 focus:ring-slate-100 outline-none transition-all placeholder:text-slate-400"
              placeholder="you@example.com">
          </div>
        </div>

        <div id="errorMsg" class="hidden text-sm text-red-600 bg-red-50 border border-red-200 rounded-xl px-4 py-3"></div>

        <button type="submit" id="submitBtn"
          class="w-full bg-slate-900 hover:bg-slate-800 text-white font-medium py-3 px-4 rounded-xl transition-all shadow-lg hover:shadow-xl flex items-center justify-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed">
          <span>Send reset link</span>
          <i data-lucide="arrow-right" class="h-4 w-4"></i>
        </button>
      </form>

      <div class="mt-6 pt-6 border-t border-slate-200 text-center">
        <a href="login.html" class="text-sm text-slate-500 hover:text-slate-700">Back to sign in</a>
      </div>
    </div>

    <!-- Success state -->
    <div id="successCard" class="hidden bg-white rounded-3xl shadow-xl border border-slate-200 p-8 text-center">
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-emerald-50 mb-5">
        <i data-lucide="mail-check" class="h-7 w-7 text-emerald-500"></i>
      </div>
      <h2 class="text-xl font-semibold text-slate-900 mb-2">Check your inbox</h2>
      <p class="text-sm text-slate-500 mb-6">If an account exists for <strong id="sentTo" class="text-slate-700"></strong>, a reset link has been sent. It expires in 1 hour.</p>
      <a href="login.html" class="inline-block rounded-xl bg-slate-900 text-white px-6 py-2.5 text-sm font-medium hover:bg-slate-800 transition-colors">Back to sign in</a>
    </div>
  </div>

  <script>
    lucide.createIcons();

    document.getElementById('forgotForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const btn = document.getElementById('submitBtn');
      const errEl = document.getElementById('errorMsg');
      errEl.classList.add('hidden');

      btn.disabled = true;
      btn.innerHTML = '<div class="w-4 h-4 border-2 border-white/40 border-t-white rounded-full animate-spin"></div><span>Sending…</span>';

      try {
        const res = await fetch('/api/auth/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email }),
        });

        if (!res.ok) {
          const j = await res.json().catch(() => ({}));
          throw new Error(j.error || 'Something went wrong. Please try again.');
        }

        document.getElementById('sentTo').textContent = email;
        document.getElementById('formCard').classList.add('hidden');
        document.getElementById('successCard').classList.remove('hidden');
        lucide.createIcons();
      } catch (err) {
        errEl.textContent = err.message;
        errEl.classList.remove('hidden');
        btn.disabled = false;
        btn.innerHTML = '<span>Send reset link</span><i data-lucide="arrow-right" class="h-4 w-4"></i>';
        lucide.createIcons();
      }
    });
  </script>
</body>
</html>
