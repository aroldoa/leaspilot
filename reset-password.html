<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password – LeasePilot</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@0.469.0"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-gradient-to-br from-slate-50 to-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <a href="login.html">
        <img src="https://ik.imagekit.io/primo/Primo%20Motif/leasepilot-logo.svg" alt="LeasePilot" class="h-10 mx-auto">
      </a>
    </div>

    <!-- Invalid token state -->
    <div id="stateInvalid" class="hidden bg-white rounded-3xl shadow-xl border border-red-200 p-8 text-center">
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-red-50 mb-5">
        <i data-lucide="alert-circle" class="h-7 w-7 text-red-400"></i>
      </div>
      <h2 class="text-xl font-semibold text-slate-900 mb-2">Link invalid or expired</h2>
      <p class="text-sm text-slate-500 mb-6">This password reset link is invalid or has expired. Please request a new one.</p>
      <a href="forgot-password.html" class="inline-block rounded-xl bg-slate-900 text-white px-6 py-2.5 text-sm font-medium hover:bg-slate-800 transition-colors">Request new link</a>
    </div>

    <!-- Reset form -->
    <div id="stateForm" class="hidden bg-white rounded-3xl shadow-xl border border-slate-200 p-8">
      <div class="mb-6">
        <h1 class="text-2xl font-semibold text-slate-900 mb-2">Set new password</h1>
        <p class="text-sm text-slate-500">Choose a strong password for your account.</p>
      </div>

      <form id="resetForm" class="space-y-5">
        <div>
          <label for="password" class="block text-sm font-medium text-slate-700 mb-2">New password</label>
          <div class="relative">
            <i data-lucide="lock" class="absolute left-3 top-1/2 -translate-y-1/2 h-5 w-5 text-slate-400"></i>
            <input type="password" id="password" name="password" required minlength="8"
              class="w-full pl-10 pr-12 py-3 rounded-xl border border-slate-200 bg-slate-50 focus:bg-white focus:border-slate-400 focus:ring-2 focus:ring-slate-100 outline-none transition-all placeholder:text-slate-400"
              placeholder="Min. 8 characters">
            <button type="button" onclick="toggleVisibility('password', 'eye1')" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600">
              <i data-lucide="eye" id="eye1" class="h-5 w-5"></i>
            </button>
          </div>
        </div>

        <div>
          <label for="confirm" class="block text-sm font-medium text-slate-700 mb-2">Confirm password</label>
          <div class="relative">
            <i data-lucide="lock" class="absolute left-3 top-1/2 -translate-y-1/2 h-5 w-5 text-slate-400"></i>
            <input type="password" id="confirm" name="confirm" required minlength="8"
              class="w-full pl-10 pr-12 py-3 rounded-xl border border-slate-200 bg-slate-50 focus:bg-white focus:border-slate-400 focus:ring-2 focus:ring-slate-100 outline-none transition-all placeholder:text-slate-400"
              placeholder="Repeat password">
            <button type="button" onclick="toggleVisibility('confirm', 'eye2')" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600">
              <i data-lucide="eye" id="eye2" class="h-5 w-5"></i>
            </button>
          </div>
        </div>

        <div id="errorMsg" class="hidden text-sm text-red-600 bg-red-50 border border-red-200 rounded-xl px-4 py-3"></div>

        <button type="submit" id="submitBtn"
          class="w-full bg-slate-900 hover:bg-slate-800 text-white font-medium py-3 px-4 rounded-xl transition-all shadow-lg hover:shadow-xl flex items-center justify-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed">
          <i data-lucide="check" class="h-4 w-4"></i>
          <span>Save new password</span>
        </button>
      </form>
    </div>

    <!-- Success state -->
    <div id="stateSuccess" class="hidden bg-white rounded-3xl shadow-xl border border-slate-200 p-8 text-center">
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-emerald-50 mb-5">
        <i data-lucide="check-circle-2" class="h-7 w-7 text-emerald-500"></i>
      </div>
      <h2 class="text-xl font-semibold text-slate-900 mb-2">Password updated!</h2>
      <p class="text-sm text-slate-500 mb-6">Your password has been changed. You can now sign in with your new password.</p>
      <a href="login.html" class="inline-block rounded-xl bg-slate-900 text-white px-6 py-2.5 text-sm font-medium hover:bg-slate-800 transition-colors">Sign in</a>
    </div>
  </div>

  <script>
    lucide.createIcons();

    const token = new URLSearchParams(window.location.search).get('token');

    function show(id) {
      ['stateInvalid', 'stateForm', 'stateSuccess'].forEach(s => {
        document.getElementById(s).classList.toggle('hidden', s !== id);
      });
      lucide.createIcons();
    }

    if (!token || !/^[a-f0-9]{64}$/.test(token)) {
      show('stateInvalid');
    } else {
      show('stateForm');
    }

    function toggleVisibility(inputId, iconId) {
      const input = document.getElementById(inputId);
      const icon = document.getElementById(iconId);
      if (input.type === 'password') {
        input.type = 'text';
        icon.setAttribute('data-lucide', 'eye-off');
      } else {
        input.type = 'password';
        icon.setAttribute('data-lucide', 'eye');
      }
      lucide.createIcons();
    }

    document.getElementById('resetForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirm').value;
      const btn = document.getElementById('submitBtn');
      const errEl = document.getElementById('errorMsg');
      errEl.classList.add('hidden');

      if (password !== confirm) {
        errEl.textContent = 'Passwords do not match.';
        errEl.classList.remove('hidden');
        return;
      }
      if (password.length < 8) {
        errEl.textContent = 'Password must be at least 8 characters.';
        errEl.classList.remove('hidden');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<div class="w-4 h-4 border-2 border-white/40 border-t-white rounded-full animate-spin"></div><span>Saving…</span>';

      try {
        const res = await fetch('/api/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, password }),
        });
        const j = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(j.error || 'Something went wrong. Please try again.');
        show('stateSuccess');
      } catch (err) {
        errEl.textContent = err.message;
        errEl.classList.remove('hidden');
        btn.disabled = false;
        btn.innerHTML = '<i data-lucide="check" class="h-4 w-4"></i><span>Save new password</span>';
        lucide.createIcons();
      }
    });
  </script>
</body>
</html>
