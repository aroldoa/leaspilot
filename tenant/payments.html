<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payments - Tenant Portal | LeasePilot</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@0.469.0"></script>
  <script src="../app.js"></script>
  <script src="notifications.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-[#F3F5F7] text-slate-900 antialiased">
  <div class="min-h-screen">
    <header class="bg-white border-b border-slate-200">
      <div class="max-w-5xl mx-auto px-4 py-4 flex items-center justify-between">
        <a href="dashboard.html" class="flex items-center gap-2">
          <img src="https://ik.imagekit.io/primo/Primo%20Motif/leasepilot-logo.svg" alt="LeasePilot" class="h-9">
        </a>
        <nav class="flex items-center gap-1">
          <a href="dashboard.html" class="rounded-full px-4 py-2 text-sm text-slate-600 hover:bg-slate-50">Dashboard</a>
          <a href="payments.html" class="rounded-full bg-slate-100 px-4 py-2 text-sm font-medium text-slate-900">Payments</a>
          <a href="maintenance.html" class="rounded-full px-4 py-2 text-sm text-slate-600 hover:bg-slate-50">Maintenance</a>
          <a href="documents.html" class="rounded-full px-4 py-2 text-sm text-slate-600 hover:bg-slate-50">Documents</a>
          <a href="messages.html" class="rounded-full px-4 py-2 text-sm text-slate-600 hover:bg-slate-50 inline-flex items-center gap-1.5">Messages <span id="tenantNavMessagesBadge" class="hidden inline-flex items-center justify-center min-w-[1.25rem] h-5 px-1.5 rounded-full bg-red-500 text-white text-xs font-semibold">0</span></a>
          <a href="profile.html" class="rounded-full px-4 py-2 text-sm text-slate-600 hover:bg-slate-50">Profile</a>
          <button onclick="LeasePilot.logout()" class="rounded-full p-2 text-slate-400 hover:text-slate-600" title="Sign out"><i data-lucide="log-out" class="h-4 w-4"></i></button>
        </nav>
      </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 py-8 space-y-6">
      <h1 class="text-2xl font-semibold text-slate-900">Payments</h1>

      <!-- Success banner -->
      <div id="bannerSuccess" class="hidden bg-emerald-50 border border-emerald-200 rounded-2xl p-4 flex items-center gap-3">
        <i data-lucide="check-circle-2" class="h-5 w-5 text-emerald-500 flex-shrink-0"></i>
        <p class="text-sm font-medium text-emerald-800">Payment submitted successfully! It may take a moment to reflect in your history.</p>
      </div>

      <!-- Cancelled banner -->
      <div id="bannerCancelled" class="hidden bg-amber-50 border border-amber-200 rounded-2xl p-4 flex items-center gap-3">
        <i data-lucide="alert-circle" class="h-5 w-5 text-amber-500 flex-shrink-0"></i>
        <p class="text-sm font-medium text-amber-800">Payment was cancelled. No charges were made.</p>
      </div>

      <!-- Pay rent card -->
      <div class="bg-white rounded-2xl border border-slate-100 p-6 shadow-sm">
        <div class="flex items-start justify-between flex-wrap gap-4">
          <div>
            <p class="text-sm text-slate-500 mb-1">Rent due</p>
            <p id="rentAmount" class="text-3xl font-semibold text-slate-900">—</p>
            <p id="rentPeriod" class="text-xs text-slate-400 mt-1"></p>
          </div>
          <button id="payBtn"
            class="inline-flex items-center gap-2 rounded-xl bg-slate-900 text-white px-5 py-2.5 text-sm font-medium hover:bg-slate-800 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
            <i data-lucide="credit-card" class="h-4 w-4"></i>
            Pay rent
          </button>
        </div>

        <!-- No-payment manager notice (shown when Stripe not connected) -->
        <div id="noPaymentNotice" class="hidden mt-4 rounded-xl bg-slate-50 border border-slate-200 px-4 py-3 text-sm text-slate-600"></div>
      </div>

      <!-- Payment history -->
      <div class="bg-white rounded-2xl border border-slate-100 p-6 shadow-sm">
        <h2 class="text-lg font-medium text-slate-900 mb-4">Payment history</h2>
        <div id="paymentHistory" class="text-sm text-slate-400">Loading…</div>
      </div>
    </main>
  </div>

  <script>
    (async () => {
      let wait = 0;
      while (typeof LeasePilot === 'undefined' && wait < 100) { await new Promise(r => setTimeout(r, 50)); wait++; }
      if (typeof LeasePilot === 'undefined') return;
      await LeasePilot.checkAuth();
      lucide.createIcons();

      const params = new URLSearchParams(window.location.search);
      if (params.get('success') === '1') {
        document.getElementById('bannerSuccess').classList.remove('hidden');
        // Clean URL
        history.replaceState({}, '', '/tenant/payments.html');
      }
      if (params.get('cancelled') === '1') {
        document.getElementById('bannerCancelled').classList.remove('hidden');
        history.replaceState({}, '', '/tenant/payments.html');
      }

      // Load rent amount from lease
      let rentAmount = 0;
      try {
        const lease = await LeasePilot.API.get('/tenant/lease');
        rentAmount = lease.property_rent ? parseFloat(lease.property_rent) : 0;
        const fmt = rentAmount > 0
          ? '$' + rentAmount.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })
          : '—';
        document.getElementById('rentAmount').textContent = fmt;
        const now = new Date();
        document.getElementById('rentPeriod').textContent =
          now.toLocaleString('en-US', { month: 'long', year: 'numeric' });
      } catch (e) {}

      // Pay button
      const payBtn = document.getElementById('payBtn');
      payBtn.addEventListener('click', async () => {
        payBtn.disabled = true;
        payBtn.innerHTML = '<div class="w-4 h-4 border-2 border-white/40 border-t-white rounded-full animate-spin"></div><span>Processing…</span>';
        try {
          const r = await LeasePilot.API.post('/tenant/pay', {});
          if (r.checkoutUrl) {
            window.location.href = r.checkoutUrl;
            return;
          }
          // No Stripe — show manager message
          const notice = document.getElementById('noPaymentNotice');
          notice.textContent = r.message || 'Payment not available. Please contact your property manager.';
          notice.classList.remove('hidden');
          payBtn.disabled = false;
          payBtn.innerHTML = '<i data-lucide="credit-card" class="h-4 w-4"></i><span>Pay rent</span>';
          lucide.createIcons();
          loadHistory();
        } catch (err) {
          if (LeasePilot.Toast) LeasePilot.Toast.show(err.message || 'Unable to process payment.', 'error');
          payBtn.disabled = false;
          payBtn.innerHTML = '<i data-lucide="credit-card" class="h-4 w-4"></i><span>Pay rent</span>';
          lucide.createIcons();
        }
      });

      loadHistory();

      async function loadHistory() {
        const el = document.getElementById('paymentHistory');
        try {
          const list = await LeasePilot.API.get('/tenant/payments');
          if (!list || !list.length) {
            el.innerHTML = '<p class="text-slate-400 text-sm">No payment history yet.</p>';
            return;
          }
          el.innerHTML = list.map(function (p) {
            const amt = p.amount != null
              ? '$' + Math.abs(parseFloat(p.amount)).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })
              : '—';
            const date = p.created_at
              ? new Date(p.created_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })
              : '—';
            const desc = p.description || (p.period_month ? 'Rent – ' + p.period_month : 'Payment');
            const status = (p.status || '').toLowerCase();
            const statusHtml = status === 'paid'
              ? '<span class="rounded-full bg-emerald-50 px-2.5 py-0.5 text-xs font-medium text-emerald-700">Paid</span>'
              : status === 'pending'
              ? '<span class="rounded-full bg-amber-50 px-2.5 py-0.5 text-xs font-medium text-amber-700">Pending</span>'
              : '<span class="rounded-full bg-slate-100 px-2.5 py-0.5 text-xs font-medium text-slate-600">' + status + '</span>';
            return '<div class="flex items-center justify-between py-3 border-b border-slate-50 last:border-0">'
              + '<div><p class="text-sm font-medium text-slate-900">' + desc + '</p>'
              + '<p class="text-xs text-slate-400 mt-0.5">' + date + '</p></div>'
              + '<div class="flex items-center gap-3">' + statusHtml
              + '<span class="text-sm font-semibold text-slate-900">' + amt + '</span></div>'
              + '</div>';
          }).join('');
        } catch (e) {
          el.innerHTML = '<p class="text-slate-400 text-sm">Unable to load payment history.</p>';
        }
      }
    })();
  </script>
</body>
</html>
