<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accept Invite — LeasePilot AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@0.469.0"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>body { font-family: 'Inter', sans-serif; background: #F3F5F7; }</style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <a href="index.html">
        <img src="https://ik.imagekit.io/primo/Primo%20Motif/leasepilot-logo.svg" alt="LeasePilot AI" class="h-10 mx-auto">
      </a>
    </div>

    <!-- Loading state -->
    <div id="loadingCard" class="bg-white rounded-3xl border border-slate-100 shadow-sm p-8 text-center">
      <div class="animate-spin h-8 w-8 rounded-full border-2 border-slate-300 border-t-slate-900 mx-auto mb-4"></div>
      <p class="text-sm text-slate-500">Loading invite details…</p>
    </div>

    <!-- Error state -->
    <div id="errorCard" class="hidden bg-white rounded-3xl border border-red-200 shadow-sm p-8 text-center">
      <div class="h-12 w-12 rounded-full bg-red-100 flex items-center justify-center mx-auto mb-4">
        <i data-lucide="alert-circle" class="h-6 w-6 text-red-500"></i>
      </div>
      <h2 class="text-lg font-semibold text-slate-900 mb-2">Invite not found</h2>
      <p id="errorMsg" class="text-sm text-slate-500 mb-6">This invite link is invalid or has expired.</p>
      <a href="index.html" class="inline-block rounded-xl bg-slate-900 px-5 py-2.5 text-sm font-medium text-white hover:bg-slate-800 transition-colors">Go to Dashboard</a>
    </div>

    <!-- Invite details card -->
    <div id="inviteCard" class="hidden bg-white rounded-3xl border border-slate-100 shadow-sm p-8">
      <div class="h-14 w-14 rounded-2xl bg-slate-900 flex items-center justify-center mx-auto mb-6">
        <i data-lucide="building-2" class="h-7 w-7 text-white"></i>
      </div>
      <h2 class="text-xl font-semibold text-slate-900 text-center mb-1">You're invited!</h2>
      <p class="text-sm text-slate-500 text-center mb-6" id="inviteSubtitle"></p>

      <div class="bg-slate-50 rounded-2xl p-4 mb-6 space-y-3">
        <div class="flex items-center justify-between">
          <span class="text-xs text-slate-500">Access</span>
          <span class="text-sm font-semibold text-slate-900">All properties</span>
        </div>
        <div class="flex items-center justify-between">
          <span class="text-xs text-slate-500">Role</span>
          <span id="inviteRole" class="text-sm font-medium text-slate-700 capitalize"></span>
        </div>
        <div class="flex items-center justify-between">
          <span class="text-xs text-slate-500">Expires</span>
          <span id="inviteExpires" class="text-sm font-medium text-slate-700"></span>
        </div>
      </div>

      <!-- Logged in: accept button -->
      <div id="acceptSection" class="hidden">
        <p class="text-sm text-slate-500 text-center mb-4">Logged in as <strong id="loggedInEmail" class="text-slate-800"></strong></p>
        <button onclick="acceptInvite()" id="acceptBtn"
          class="w-full rounded-xl bg-slate-900 px-5 py-3 text-sm font-medium text-white hover:bg-slate-800 transition-colors flex items-center justify-center gap-2">
          <i data-lucide="check-circle" class="h-4 w-4"></i> Accept &amp; Join Property
        </button>
        <p class="text-xs text-slate-400 text-center mt-3">Not you? <a href="login.html" class="underline text-slate-600">Sign in with a different account</a></p>
      </div>

      <!-- Not logged in: login / register -->
      <div id="authSection" class="hidden">
        <div class="flex rounded-xl border border-slate-200 overflow-hidden mb-5">
          <button id="tabLogin" onclick="switchTab('login')" class="flex-1 py-2.5 text-sm font-medium transition-colors bg-slate-900 text-white">Sign In</button>
          <button id="tabRegister" onclick="switchTab('register')" class="flex-1 py-2.5 text-sm font-medium transition-colors text-slate-600 hover:bg-slate-50">Register</button>
        </div>

        <form id="loginForm" onsubmit="submitLogin(event)" class="space-y-3">
          <input id="loginEmail" type="email" placeholder="Email" required
            class="w-full rounded-xl border border-slate-200 px-4 py-2.5 text-sm outline-none focus:border-slate-400">
          <input id="loginPassword" type="password" placeholder="Password" required
            class="w-full rounded-xl border border-slate-200 px-4 py-2.5 text-sm outline-none focus:border-slate-400">
          <button type="submit" id="loginBtn"
            class="w-full rounded-xl bg-slate-900 px-5 py-2.5 text-sm font-medium text-white hover:bg-slate-800 transition-colors">
            Sign In &amp; Accept
          </button>
          <p id="loginError" class="hidden text-xs text-red-600 text-center"></p>
        </form>

        <form id="registerForm" onsubmit="submitRegister(event)" class="hidden space-y-3">
          <input id="regName" type="text" placeholder="Full Name" required
            class="w-full rounded-xl border border-slate-200 px-4 py-2.5 text-sm outline-none focus:border-slate-400">
          <input id="regEmail" type="email" placeholder="Email" required
            class="w-full rounded-xl border border-slate-200 px-4 py-2.5 text-sm outline-none focus:border-slate-400">
          <input id="regPassword" type="password" placeholder="Password (min 8 chars, 1 uppercase, 1 number)" required
            class="w-full rounded-xl border border-slate-200 px-4 py-2.5 text-sm outline-none focus:border-slate-400">
          <button type="submit" id="registerBtn"
            class="w-full rounded-xl bg-slate-900 px-5 py-2.5 text-sm font-medium text-white hover:bg-slate-800 transition-colors">
            Create Account &amp; Accept
          </button>
          <p id="registerError" class="hidden text-xs text-red-600 text-center"></p>
        </form>
      </div>
    </div>

    <!-- Success card -->
    <div id="successCard" class="hidden bg-white rounded-3xl border border-emerald-200 shadow-sm p-8 text-center">
      <div class="h-14 w-14 rounded-full bg-emerald-100 flex items-center justify-center mx-auto mb-4">
        <i data-lucide="check-circle-2" class="h-8 w-8 text-emerald-600"></i>
      </div>
      <h2 class="text-xl font-semibold text-slate-900 mb-2">You're in!</h2>
      <p class="text-sm text-slate-500 mb-6">You now have access to <strong id="successPropertyName" class="text-slate-800"></strong>.</p>
      <a href="properties.html" class="inline-block rounded-xl bg-slate-900 px-6 py-3 text-sm font-medium text-white hover:bg-slate-800 transition-colors">
        Go to My Properties
      </a>
    </div>
  </div>

  <script>
    const token = new URLSearchParams(window.location.search).get('token');
    let inviteData = null;

    function show(id) {
      ['loadingCard','errorCard','inviteCard','successCard'].forEach(c => {
        document.getElementById(c).classList.add('hidden');
      });
      document.getElementById(id).classList.remove('hidden');
    }

    function switchTab(tab) {
      document.getElementById('loginForm').classList.toggle('hidden', tab !== 'login');
      document.getElementById('registerForm').classList.toggle('hidden', tab !== 'register');
      document.getElementById('tabLogin').className = 'flex-1 py-2.5 text-sm font-medium transition-colors ' + (tab === 'login' ? 'bg-slate-900 text-white' : 'text-slate-600 hover:bg-slate-50');
      document.getElementById('tabRegister').className = 'flex-1 py-2.5 text-sm font-medium transition-colors ' + (tab === 'register' ? 'bg-slate-900 text-white' : 'text-slate-600 hover:bg-slate-50');
    }

    async function loadInvite() {
      if (!token) { show('errorCard'); return; }
      try {
        const res = await fetch('/api/invites/accept/' + token);
        if (!res.ok) throw new Error();
        inviteData = await res.json();

        document.getElementById('inviteRole').textContent = inviteData.role === 'manager' ? 'Property Manager' : inviteData.role;
        document.getElementById('inviteExpires').textContent = new Date(inviteData.expires_at).toLocaleDateString();
        document.getElementById('inviteSubtitle').textContent =
          inviteData.invited_by_name + ' has invited you to help manage their properties on LeasePilot AI.';

        // Check if already logged in
        const stored = localStorage.getItem('user');
        if (stored) {
          try {
            const user = JSON.parse(stored);
            document.getElementById('loggedInEmail').textContent = user.email || user.name || '';
            document.getElementById('acceptSection').classList.remove('hidden');

            // Pre-fill invite email
            if (inviteData.invited_email) {
              document.getElementById('loginEmail').value = inviteData.invited_email;
              document.getElementById('regEmail').value = inviteData.invited_email;
            }
          } catch (e) {}
        } else {
          document.getElementById('authSection').classList.remove('hidden');
          if (inviteData.invited_email) {
            document.getElementById('loginEmail').value = inviteData.invited_email;
            document.getElementById('regEmail').value = inviteData.invited_email;
          }
        }

        show('inviteCard');
        lucide.createIcons();
      } catch (e) {
        show('errorCard');
        lucide.createIcons();
      }
    }

    async function acceptInvite() {
      const btn = document.getElementById('acceptBtn');
      btn.disabled = true; btn.textContent = 'Accepting…';
      try {
        const res = await fetch('/api/invites/accept/' + token, { method: 'POST', credentials: 'include' });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Failed');
        document.getElementById('successPropertyName').textContent = inviteData?.invited_by_name ? inviteData.invited_by_name + "'s properties" : 'all properties';
        show('successCard');
        lucide.createIcons();
      } catch (e) {
        alert(e.message || 'Failed to accept invite.');
        btn.disabled = false; btn.innerHTML = '<i data-lucide="check-circle" class="h-4 w-4"></i> Accept & Join Property';
        lucide.createIcons();
      }
    }

    async function submitLogin(e) {
      e.preventDefault();
      const errEl = document.getElementById('loginError');
      errEl.classList.add('hidden');
      const btn = document.getElementById('loginBtn');
      btn.disabled = true; btn.textContent = 'Signing in…';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST', credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('loginEmail').value,
            password: document.getElementById('loginPassword').value,
          }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Login failed');
        localStorage.setItem('user', JSON.stringify(data.user));
        await acceptInvite();
      } catch (e) {
        errEl.textContent = e.message; errEl.classList.remove('hidden');
      }
      btn.disabled = false; btn.textContent = 'Sign In & Accept';
    }

    async function submitRegister(e) {
      e.preventDefault();
      const errEl = document.getElementById('registerError');
      errEl.classList.add('hidden');
      const btn = document.getElementById('registerBtn');
      btn.disabled = true; btn.textContent = 'Creating account…';

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST', credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name: document.getElementById('regName').value,
            email: document.getElementById('regEmail').value,
            password: document.getElementById('regPassword').value,
          }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Registration failed');
        localStorage.setItem('user', JSON.stringify(data.user));
        await acceptInvite();
      } catch (e) {
        errEl.textContent = e.message; errEl.classList.remove('hidden');
      }
      btn.disabled = false; btn.textContent = 'Create Account & Accept';
    }

    loadInvite();
  </script>
</body>
</html>
